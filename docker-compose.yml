services:
  bot:
    build: .
    container_name: hse_tgbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./src:/app/src # Монтируем код, чтобы потом проще отлаживать
      - ./data:/app/data # Для сохранения SQLite между перезапусками
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
